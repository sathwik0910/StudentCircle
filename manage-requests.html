
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Requests | StudentCircle</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .requests-page {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .request-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      margin: 16px 0;
    }

    .request-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .request-actions button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    .approve-btn {
      background: #dcfce7;
      color: #166534;
    }

    .reject-btn {
      background: #fee2e2;
      color: #991b1b;
    }

    .request-status {
      font-weight: 600;
    }

    .request-message {
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <main class="requests-page">
    <h1>Manage Join Requests</h1>
    <p>Review requests submitted to your study groups.</p>

    <button id="refreshRequests">Refresh Requests</button>
    <p id="pageMessage" role="status"></p>
    <div id="requestsContainer"></div>
  </main>

  <script src="manage-requests.js"></script>
</body>
</html>
