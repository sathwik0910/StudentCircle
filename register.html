
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | StudentCircle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-container">
    <h1>Join StudentCircle</h1>
    <p>Create your student account to find study partners.</p>

    <form id="registerForm">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text"
             minlength="2" maxlength="60" required>

      <label for="email">Email address</label>
      <input id="email" name="email" type="email"
             autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             minlength="8" maxlength="72"
             autocomplete="new-password" required>

      <button type="submit">Create Account</button>
      <p id="authMessage" role="status"></p>
    </form>

    <p>Already registered? <a href="login.html">Log in</a></p>
    <p><a href="find-groups.html">Browse study groups</a></p>
  </main>

  <script src="auth-page.js"></script>
</body>
</html>
